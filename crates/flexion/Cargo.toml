[package]
name = "flexion"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "The runtime of learned inflection grammars: paradigms, the rules that choose them, stress and sound laws, with candidates that explain themselves"

[dependencies]
sound-law = { workspace = true }
sound-law-macros = { workspace = true }
flexion-macros = { workspace = true }
unicode-normalization = { workspace = true }
serde = { workspace = true, optional = true }

[features]
# Serialize a learned grammar (for a trainer that keeps what it learned);
# generated crates don't need it.
serde = ["dep:serde", "sound-law/serde"]

[lints]
workspace = true
