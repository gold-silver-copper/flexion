[package]
name = "flexion-train"
version = "0.2.0"
description = "Learn a language's inflection grammar from Wiktionary and write it as a Rust crate"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flexion = { workspace = true, features = ["serde"] }
sound-law = { workspace = true, features = ["serde"] }
serde = { workspace = true }
# Floats read back exactly as written: a saved build reprints byte for byte.
serde_json = { workspace = true, features = ["float_roundtrip"] }
flate2 = { workspace = true }
unicode-normalization = { workspace = true }

[lints]
workspace = true
