# Generated by flexion-train from configs/src/english.rs. Regenerate with
# `cargo xtask build english --dump <kaikki English dump>`; don't edit by hand.

[package]
name = "english"
version = "0.5.0"
description = "English inflection for any word: noun plurals, verb forms, comparatives and superlatives, with confidence scores, learned from Wiktionary"
readme = "README.md"
license = "(MIT OR Apache-2.0) AND CC-BY-SA-4.0"
keywords = ["english", "inflection", "morphology", "linguistics", "nlp"]
categories = ["text-processing"]
include = ["src/**", "README.md", "DATA-LICENSE.md", "LICENSE-MIT", "LICENSE-APACHE"]
authors.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

# The crate's tests are its README's examples (doctests); without unit tests
# the big generated model isn't compiled a second time for a test harness.
[lib]
test = false

[dependencies]
flexion = { workspace = true }

[lints]
workspace = true
