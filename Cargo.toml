[workspace]
members = ["crates/flexion"]
resolver = "3"

[workspace.package]
authors = ["gold-silver-copper"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/flexion"
rust-version = "1.88"

[workspace.dependencies]
flexion = { path = "crates/flexion", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
