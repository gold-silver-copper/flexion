[workspace]
members = ["crates/*", "languages/*", "xtask"]
resolver = "3"

[workspace.package]
authors = ["gold-silver-copper"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/flexion"
rust-version = "1.88"

[workspace.dependencies]
flexion = { path = "crates/flexion", version = "0.2.0" }
flexion-train = { path = "crates/flexion-train", version = "0.2.0" }
sound-law = { path = "crates/sound-law", version = "0.1.0" }
sound-law-macros = { path = "crates/sound-law-macros", version = "0.1.0" }
flexion-macros = { path = "crates/flexion-macros", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
