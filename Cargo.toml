[workspace]
members = ["crates/*", "languages/*", "xtask"]
resolver = "3"

[workspace.package]
authors = ["gold-silver-copper"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/flexion"
rust-version = "1.88"

[workspace.dependencies]
flexion = { path = "crates/flexion", version = "0.2.0" }
flexion-train = { path = "crates/flexion-train", version = "0.2.0" }
sound-law = { path = "crates/sound-law", version = "0.1.0" }
sound-law-macros = { path = "crates/sound-law-macros", version = "0.1.0" }
flexion-macros = { path = "crates/flexion-macros", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3

# Dependencies and the workspace's own crates are optimized in dev and test builds: the
# end-to-end test learns real grammars, and unoptimized it took 806 of CI's 906 seconds
# (34 seconds at opt-level 2). `"*"` reaches dependencies only.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.flexion]
opt-level = 2

[profile.dev.package.flexion-train]
opt-level = 2

[profile.dev.package.flexion-configs]
opt-level = 2

[profile.dev.package.flexion-macros]
opt-level = 2

[profile.dev.package.sound-law]
opt-level = 2

[profile.dev.package.sound-law-macros]
opt-level = 2
